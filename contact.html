<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Steven's Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <h1 class="logo">My Portfolio</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="ethics.html">Ethics</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="about">

            <h2>Contact Me</h2>

            <p>
                If you have a question, suggestion, or feedback,
                you can send me a message using the form below.
            </p>

        </section>


        <section class="about">

            <form id="contactForm">

                <label for="name">
                    Name
                </label>

                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                    style="width: 100%; padding: 10px; margin: 8px 0 15px;"
                >

                <br>


                <label for="email">
                    Email
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    style="width: 100%; padding: 10px; margin: 8px 0 15px;"
                >

                <br>


                <label for="message">
                    Message
                </label>

                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message..."
                    required
                    style="width: 100%; padding: 10px; margin: 8px 0 15px;"
                ></textarea>

                <br>


                <button type="submit" class="button">
                    Send Message
                </button>

            </form>


            <p id="formMessage"></p>

        </section>

    </main>


    <footer>
        <p>
            &copy; 2026 Steven Vallejos | Personal Portfolio
        </p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
